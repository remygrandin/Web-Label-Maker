<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labelbench</title>
    <base href="/" />
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        try {
            var t = JSON.parse(localStorage.getItem('lb.settings') || '{}').theme;
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { }
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-mark">LABELBENCH</div>
            <div class="boot-bar"><i></i></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Your work is autosaved.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">Dismiss</span>
    </div>
    <script src="js/lm.core.js"></script>
    <script src="js/lm.render.js"></script>
    <script src="js/lm.io.js"></script>
    <script src="js/lm.serial.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
